title = "Jump to a label"
chapter = "search"
kind = "learn"
feature = "gw jumps to a word by its label; the case picks the cursor and the WORD"
lesson = """
`gw` puts a two-letter label on every word on screen: type one to select that
word, wherever it is. The case of the letters is an option (this fork): `Ab`
puts the cursor at the start instead of the end, and `aB` takes the WORD
around the word, up to the spaces, as `W` is to `w`; `AB` does both.
"""
start = '''
#!/bin/sh
set -eu
cargo build --release --locked
cp target/release/vx ~/.local/bin/vx
strip ~/.local/bin/vx
tar czf dist/vx.tar.gz -C target/release vx
sha256sum dist/vx.tar.gz > dist/SUMS
gh release upload v1.2.0 dist/vx.tar.gz
'''
goal = '''
#!/bin/sh
set -eu
cargo build --release --locked
cp $root/target/release/vx $bin/vx
strip $bin/vx
tar czf dist/vx-$v.tar.gz -C target/release vx
sha256sum dist/vx-$v.tar.gz > dist/SHA256SUMS
gh release upload v$v dist/vx-$v.tar.gz
'''
hints = [
